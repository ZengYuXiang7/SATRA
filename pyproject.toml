[project]
name = "satra"
version = "0.1.0"
description = "SATRA stock prediction implementation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "einops",
    "lightgbm",
    "matplotlib",
    "numpy",
    "pandas",
    "PyWavelets",
    "scikit-learn",
    "scipy",
    "tqdm",
    "torch==2.12.1",
]

[project.scripts]
satra-train = "satra.main:main"
stockmixer-baseline = "stockmixer.run:main"
factorvae-baseline = "factorvae.run:main"
master-baseline = "master.run:main"
enhancer-baseline = "enhancer.run:main"
rsr-baseline = "rsr.run:main"
hstockgat-baseline = "hstockgat.run:main"
ci-sthpan-baseline = "ci_sthpan.run:main"
factorgcl-baseline = "factorgcl.run:main"
tra-baseline = "tra.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/satra",
    "src/observability",
    "src/metrics",
    "src/stockmixer",
    "src/factorvae",
    "src/master",
    "src/enhancer",
    "src/rsr",
    "src/hstockgat",
    "src/ci_sthpan",
    "src/factorgcl",
    "src/tra",
    "src/timeseries",
]
